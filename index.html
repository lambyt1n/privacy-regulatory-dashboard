<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球数据隐私监管动态看板</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#3b82f6;--accent2:#8b5cf6;--text:#e2e8f0;--text2:#94a3b8;--border:#334155;--red:#ef4444;--green:#22c55e;--orange:#f59e0b;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:20px}
header{text-align:center;padding:40px 20px;background:linear-gradient(135deg,var(--card) 0%,#0f172a 100%);border-bottom:1px solid var(--border);margin-bottom:30px}
header h1{font-size:2.2rem;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
header p{color:var(--text2);font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:30px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;transition:transform .2s}
.stat-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.stat-card .num{font-size:2rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.85rem;color:var(--text2);margin-top:4px}
.week-selector{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.week-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:8px;cursor:pointer;font-size:.9rem;transition:all .2s}
.week-btn:hover{border-color:var(--accent)}
.week-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.section-filters{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.8rem;transition:all .2s}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;margin-bottom:30px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(59,130,246,.15)}
.card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent)}
.card.europe::before{background:#3b82f6}
.card.north_america::before{background:#ef4444}
.card.asia_pacific::before{background:#22c55e}
.card.middle_east::before{background:#f59e0b}
.card.south_america::before{background:#8b5cf6}
.card.africa::before{background:#ec4899}
.card.court::before{background:#06b6d4}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
.card-title{font-size:1rem;font-weight:600;line-height:1.4;flex:1}
.card-badge{font-size:.7rem;padding:3px 10px;border-radius:20px;background:rgba(59,130,246,.15);color:var(--accent);white-space:nowrap}
.card-summary{font-size:.85rem;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:.75rem;color:var(--text2)}
.card-meta span{background:rgba(255,255,255,.05);padding:3px 10px;border-radius:6px}
.card-detail{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:.85rem;color:var(--text2);line-height:1.7}
.card.expanded .card-detail{display:block}
.card.expanded .card-summary{-webkit-line-clamp:unset}
.card-amount{font-size:1.1rem;font-weight:700;color:var(--orange);margin-top:8px}
.card-url{display:inline-block;margin-top:10px;color:var(--accent);text-decoration:none;font-size:.8rem}
.card-url:hover{text-decoration:underline}
.article-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;margin-top:20px}
.article-section h2{font-size:1.3rem;margin-bottom:16px;color:var(--accent)}
.article-content{font-size:.9rem;color:var(--text2);line-height:1.8;white-space:pre-wrap}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.loading{text-align:center;padding:40px;color:var(--text2)}
.error-box{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:10px;padding:20px;margin:20px 0;color:var(--red);font-size:.9rem}
footer{text-align:center;padding:30px;color:var(--text2);font-size:.8rem;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){.cards-grid{grid-template-columns:1fr}header h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>全球数据隐私监管动态看板</h1>
<p>每周汇总全球数据保护机构执法、法院判决与AI监管动态</p>
</header>

<div id="loading" class="loading">正在加载数据...</div>
<div id="errorBox"></div>

<div id="dashboard" style="display:none">
  <div class="stats" id="stats"></div>
  <div class="week-selector" id="weekSelector"></div>
  <div class="section-filters" id="sectionFilters"></div>
  <div class="cards-grid" id="cardsGrid"></div>
  <div class="article-section" id="articleSection" style="display:none">
    <h2>本周分析文章</h2>
    <div class="article-content" id="articleContent"></div>
  </div>
</div>

<footer>
<p>数据隐私监管动态周报 · 自动化汇总系统</p>
<p id="footerDate"></p>
</footer>
</div>

<script>
const sectionColors = {
  europe: '#3b82f6', north_america: '#ef4444', asia_pacific: '#22c55e',
  middle_east: '#f59e0b', south_america: '#8b5cf6', africa: '#ec4899', court: '#06b6d4'
};
const sectionNames = {
  europe: '欧盟与欧洲', north_america: '北美', asia_pacific: '亚太',
  middle_east: '中东', south_america: '南美洲', africa: '非洲', court: '法院判决'
};

let currentWeek = '';
let currentFilter = 'all';
let indexData = null;
let allReports = {};

async function loadData() {
  try {
    // Load index
    const idxResp = await fetch('data/index.json');
    if (!idxResp.ok) throw new Error('Failed to load index.json: ' + idxResp.status);
    indexData = await idxResp.json();

    // Load all reports
    for (const week of indexData.weeks) {
      const rResp = await fetch('data/' + week.report);
      if (rResp.ok) {
        allReports[week.date] = await rResp.json();
      }
    }

    currentWeek = indexData.weeks[0].date;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderAll();
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('errorBox').innerHTML = '<div class="error-box">加载数据失败: ' + err.message + '<br>请检查控制台获取详细信息。</div>';
    console.error(err);
  }
}

function renderStats() {
  const report = allReports[currentWeek];
  if (!report) return;
  const totalItems = report.sections.reduce((s,sec)=>s+sec.items.length,0);
  const totalFines = report.sections.flatMap(s=>s.items).filter(i=>i.amount).length;
  const sections = report.sections.length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${totalItems}</div><div class="label">监管动态</div></div>
    <div class="stat-card"><div class="num">${sections}</div><div class="label">覆盖地区</div></div>
    <div class="stat-card"><div class="num">${totalFines}</div><div class="label">含金额处罚</div></div>
    <div class="stat-card"><div class="num">${indexData.weeks.length}</div><div class="label">历史周报</div></div>
  `;
}

function renderWeekSelector() {
  document.getElementById('weekSelector').innerHTML = indexData.weeks.map(w => {
    const active = w.date === currentWeek ? 'active' : '';
    return `<button class="week-btn ${active}" onclick="switchWeek('${w.date}')">${w.date}</button>`;
  }).join('');
}

function renderFilters() {
  const report = allReports[currentWeek];
  if (!report) return;
  let html = `<button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">全部</button>`;
  report.sections.forEach(sec => {
    const active = currentFilter === sec.key ? 'active' : '';
    html += `<button class="filter-btn ${active}" onclick="setFilter('${sec.key}')">${sec.name} (${sec.items.length})</button>`;
  });
  document.getElementById('sectionFilters').innerHTML = html;
}

function renderCards() {
  const report = allReports[currentWeek];
  if (!report) return;
  let items = [];
  if (currentFilter === 'all') {
    report.sections.forEach(sec => sec.items.forEach(item => items.push({...item, sectionKey: sec.key, sectionName: sec.name})));
  } else {
    const sec = report.sections.find(s => s.key === currentFilter);
    if (sec) items = sec.items.map(item => ({...item, sectionKey: sec.key, sectionName: sec.name}));
  }

  if (items.length === 0) {
    document.getElementById('cardsGrid').innerHTML = '<div class="empty-state">该板块暂无内容</div>';
    return;
  }

  document.getElementById('cardsGrid').innerHTML = items.map(item => {
    const amount = item.amount ? `<div class="card-amount">${item.amount}</div>` : '';
    const url = item.url ? `<a class="card-url" href="${item.url}" target="_blank">查看原文 →</a>` : '';
    const source = item.source_note ? `<span>${item.source_note}</span>` : '';
    return `
      <div class="card ${item.sectionKey}" onclick="this.classList.toggle('expanded')">
        <div class="card-header">
          <div class="card-title">${escapeHtml(item.title)}</div>
          <span class="card-badge" style="background:${sectionColors[item.sectionKey]}22;color:${sectionColors[item.sectionKey]}">${item.sectionName}</span>
        </div>
        <div class="card-summary">${escapeHtml(item.summary)}</div>
        <div class="card-meta">
          <span>${escapeHtml(item.authority)}</span>
          <span>${item.item_date || '日期待定'}</span>
          <span>${escapeHtml(item.industry)}</span>
          ${source}
        </div>
        ${amount}
        <div class="card-detail">
          <p><strong>法律依据：</strong>${escapeHtml(item.legal_basis || '未注明')}</p>
          <p><strong>涉及行业：</strong>${escapeHtml(item.industry)}</p>
          <p><strong>监管机构：</strong>${escapeHtml(item.authority)}</p>
          ${url}
        </div>
      </div>
    `;
  }).join('');
}

function renderMarkdownTables(text) {
  const lines = text.split("\n");
  let result = [];
  let inTable = false;
  let tableHtml = "";
  let isFirstRow = true;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    if (line.startsWith("|") && line.endsWith("|")) {
      if (!inTable) {
        inTable = true;
        isFirstRow = true;
        tableHtml = '<table style="width:100%;border-collapse:collapse;margin:12px 0;font-size:.85rem;color:var(--text2)">';
      }
      const cells = line.split("|").slice(1, -1).map(c => c.trim());

      // Skip separator lines like |---|---|---|
      if (cells.every(c => /^[-:\s]+$/.test(c))) {
        continue;
      }

      const tag = isFirstRow ? "th" : "td";
      const cellStyle = isFirstRow
        ? 'style="border:1px solid var(--border);padding:8px 12px;background:rgba(59,130,246,.08);font-weight:600;text-align:left;color:var(--text)"'
        : 'style="border:1px solid var(--border);padding:8px 12px"';
      const row = "<tr>" + cells.map(c => "<" + tag + " " + cellStyle + ">" + escapeHtml(c) + "</" + tag + ">").join("") + "</tr>";
      tableHtml += row;
      isFirstRow = false;
    } else {
      if (inTable) {
        tableHtml += "</table>";
        result.push(tableHtml);
        inTable = false;
        tableHtml = "";
      }
      result.push(line);
    }
  }

  if (inTable) {
    tableHtml += "</table>";
    result.push(tableHtml);
  }

  return result.join("\n");
}

async function renderArticle() {
  const week = indexData.weeks.find(w => w.date === currentWeek);
  if (!week) return;
  try {
    const resp = await fetch("data/" + week.article);
    if (!resp.ok) {
      document.getElementById("articleSection").style.display = "none";
      return;
    }
    const text = await resp.text();
    document.getElementById("articleSection").style.display = "block";

    // Process tables first (before escapeHtml)
    let html = renderMarkdownTables(text);

    // Then escape and process other markdown
    html = escapeHtml(html)
      .replace(/^# (.*$)/gm, "<h1>$1</h1>")
      .replace(/^## (.*$)/gm, "<h2>$1</h2>")
      .replace(/^### (.*$)/gm, "<h3>$1</h3>")
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n/g, "<br>");

    // Restore HTML table tags that were escaped
    html = html.replace(/&lt;table/g, "<table")
               .replace(/&lt;\/table&gt;/g, "</table>")
               .replace(/&lt;tr&gt;/g, "<tr>")
               .replace(/&lt;\/tr&gt;/g, "</tr>")
               .replace(/&lt;th /g, "<th ")
               .replace(/&lt;\/th&gt;/g, "</th>")
               .replace(/&lt;td /g, "<td ")
               .replace(/&lt;\/td&gt;/g, "</td>");

    document.getElementById("articleContent").innerHTML = html;
  } catch (e) {
    document.getElementById("articleSection").style.display = "none";
  }
}
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function switchWeek(date) {
  currentWeek = date;
  currentFilter = 'all';
  renderAll();
}

function setFilter(filter) {
  currentFilter = filter;
  renderAll();
}

function renderAll() {
  renderStats();
  renderWeekSelector();
  renderFilters();
  renderCards();
  renderArticle();
  document.getElementById('footerDate').textContent = '最新更新：' + currentWeek;
}

// Start loading
loadData();
</script>
</body>
</html>
